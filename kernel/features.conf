# kernel/features.conf — vinix-mini compile-time feature selection.
#
# Single source of truth for what the fork keeps. Every EXTRA (non-minimal)
# driver or service is a flag here, default OFF (0). The phase-3 fork wires
# each flag to a VLLM_MINI_* -d define that excludes the code at compile
# time — nothing extra ships unless explicitly enabled.
#
# Minimal image (all zeros below): serial + pmm/vmm/kheap + SMP + scheduler
# + spinlock/mutex + virtio-blk + tarfs(ro) + virtio-net + static IP +
# TCP/sockets + ELF loader. That is the boot-to-token path. Everything else
# is removable by leaving its flag at 0.
#
# Format: VLLM_MINI_<FEATURE>=0|1, one per line, `#` comments allowed.
# Consumed by: kernel/mini build (phase 3), scripts/build_image.sh asserts.

# --- block storage (exactly one primary; fallbacks are REMOVED, not flagged) ---
# virtio-blk is the only disk driver. AHCI/NVMe/e1000-style fallbacks were
# deleted from the fork: they cost ~200-400 ms probe time + driver pages and
# QEMU always provides virtio-blk. No flag — there is nothing to enable.
VLLM_MINI_BLK_VIRTIO=1

# --- network ---
# virtio-net is the only NIC driver. e1000 fallback deleted (same reason).
VLLM_MINI_NET_VIRTIO=1
# DHCP client. Default OFF: static IP from cmdline (saves 1-3 s boot wait).
# Enable only for networks without predictable addressing (=1).
VLLM_MINI_NET_DHCP=0
# UDP stack. Needed ONLY by DHCP; TCP-only otherwise. Forced OFF when
# VLLM_MINI_NET_DHCP=0 (build asserts this).
VLLM_MINI_NET_UDP=0

# --- filesystems ---
# tarfs read-only (models partition). ramfs deleted: the runner needs no
# writable FS (weights RO, KV-cache is an arena, logs go to serial).
VLLM_MINI_FS_TARFS=1

# --- logging / debug (all OFF in production images) ---
# Framebuffer shell + fonts. Deleted path, kept as flag for bring-up only.
VLLM_MINI_FB_SHELL=0
# Extra syscall surface beyond socket/mmap/clock. OFF = minimal vDSO.
VLLM_MINI_EXTRA_SYSCALLS=0
# Writable root / journal. OFF = models partition mounts RO, no fsync stalls.
VLLM_MINI_RW_ROOT=0
